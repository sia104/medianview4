<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedianView4</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 1;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #dde2e8;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 16px 40px rgb(30 42 56 / 8%);
      }

      form {
        display: grid;
        gap: 16px;
      }

      input[type="file"] {
        width: 100%;
        padding: 14px;
        border: 1px dashed #8fa1b3;
        border-radius: 6px;
        background: #fbfcfd;
      }

      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        background: #16664f;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .error {
        margin: 0 0 16px;
        padding: 12px 14px;
        border-left: 4px solid #b42318;
        background: #fff2f0;
        color: #7a271a;
        border-radius: 4px;
      }

      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 10px;
        font-weight: 700;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d4dbe3;
        border-radius: 6px;
        background: #ffffff;
      }

      @media (max-width: 720px) {
        header {
          display: grid;
        }

        .comparison {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>MedianView4</h1>
        {% block action %}{% endblock %}
      </header>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
